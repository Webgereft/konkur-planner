<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برنامه‌ریز هوشمند کنکور تجربی</title>
  
  <!-- فونت وزیرمتن برای زیبایی -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <!-- آیکون‌های FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <!-- هدر شیشه‌ای -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-rocket"></i>
      <h1>کنکوریار</h1>
    </div>
    <nav>
      <button onclick="showPage('setup', this)"><i class="fa-solid fa-gear"></i> تنظیمات</button>
      <button onclick="showPage('dashboard', this)"><i class="fa-solid fa-house"></i> داشبورد</button>
      <button onclick="showPage('plan', this)"><i class="fa-solid fa-calendar-days"></i> برنامه کل</button>
      <button onclick="showPage('quiz', this)"><i class="fa-solid fa-flask"></i> آزمون‌ساز</button>
      <button onclick="showPage('analytics', this)"><i class="fa-solid fa-chart-line"></i> تحلیل آزمون</button>
      <button onclick="showPage('mistakes', this)"><i class="fa-solid fa-book-skull"></i> دفتر اشتباهات</button>
    </nav>
  </header>

  <main>
    <!-- صفحه تنظیمات -->
    <section id="page-setup" class="page">
      <div class="glass-card">
        <h2><i class="fa-solid fa-sliders"></i> تنظیمات اولیه</h2>
        <p class="subtitle">برای ساخت برنامه هوشمند، اطلاعات زیر را وارد کنید.</p>
        
        <label>رشته تحصیلی:
          <select id="field">
            <option value="تجربی">علوم تجربی</option>
          </select>
        </label>
        <label>چند روز تا کنکور مانده؟
          <input type="number" id="daysLeft" min="1" value="180" placeholder="مثلا 180">
        </label>
        <label>هدف مطالعه روزانه (ساعت):
          <input type="number" id="dailyHours" min="1" max="16" value="6" placeholder="مثلا 6">
        </label>
        
        <button class="btn-glow" onclick="saveSetup()">
          <i class="fa-solid fa-wand-magic-sparkles"></i> ساخت برنامه هوشمند
        </button>
      </div>
    </section>

    <!-- داشبورد اصلی -->
    <section id="page-dashboard" class="page hidden">
      <h2 class="page-title">داشبورد کاربری</h2>
      
      <!-- کارت‌های آمار -->
      <div id="summary" class="grid-stats"></div>
      
      <!-- لیست تسک‌ها -->
      <div class="glass-card panel-container">
        <h3><i class="fa-solid fa-list-check"></i> جلسات باقی‌مانده</h3>
        <p class="subtitle">با تیک زدن هر مورد، از لیست حذف و در آمار ثبت می‌شود.</p>
        <div id="todayTasks" class="session-list"></div>
      </div>
    </section>

    <!-- برنامه هفتگی -->
    <section id="page-plan" class="page hidden">
      <h2 class="page-title">برنامه هفتگی</h2>
      <div id="weeklyPlan" class="grid-plan"></div>
    </section>

    <!-- آزمون ساز -->
    <section id="page-quiz" class="page hidden">
      <h2 class="page-title">آزمون‌ساز هوشمند</h2>
      
      <div class="glass-card">
        <label>درس مورد نظر:
          <select id="quizSubject" onchange="loadChapters()">
            <option value="زیست">زیست‌شناسی</option>
            <option value="فیزیک">فیزیک</option>
            <option value="شیمی">شیمی</option>
            <option value="ریاضی">ریاضی</option>
            <option value="زمین‌شناسی">زمین‌شناسی</option>
          </select>
        </label>
        
        <label>نوع آزمون:
          <select id="quizType" onchange="toggleQuizType()">
            <option value="custom">فصل به فصل (یک پایه)</option>
            <option value="comprehensive">جامع (همه پایه‌ها)</option>
          </select>
        </label>
        
        <div id="customOptions">
          <label>انتخاب پایه:
            <select id="quizGrade" onchange="loadChapters()">
              <option>دهم</option>
              <option>یازدهم</option>
              <option>دوازدهم</option>
            </select>
          </label>
          <div id="chapterList" class="chapter-checkboxes"></div>
        </div>
        
        <label>تعداد سوال:
          <input type="number" id="quizCount" value="10" min="1" max="50">
        </label>
        
        <button class="btn-glow" onclick="createQuiz()">
          <i class="fa-solid fa-play"></i> شروع آزمون
        </button>
      </div>

      <div id="quizArea" class="hidden">
        <div id="quizTimer" class="glass-card timer-card">⏱️ زمان: 00:00</div>
        <div id="quizQuestions"></div>
        <button class="btn-glow btn-danger" onclick="submitQuiz()">پایان آزمون و ثبت نتیجه</button>
      </div>
    </section>

    <!-- تحلیل آزمون -->
    <section id="page-analytics" class="page hidden">
      <h2 class="page-title">تحلیل و کارنامه</h2>
      <div class="glass-card">
        <form id="examForm" class="exam-form" onsubmit="event.preventDefault();">
          <input type="text" placeholder="نام درس (مثلا زیست)" id="examSubject" required>
          <input type="number" placeholder="درصد (0 تا 100)" id="examPercent" min="0" max="100" required>
          <button class="btn-glow" onclick="saveExam()">ثبت آزمون</button>
        </form>
      </div>
      <div id="examList" class="session-list"></div>
    </section>

    <!-- دفتر اشتباهات -->
    <section id="page-mistakes" class="page hidden">
      <h2 class="page-title">دفتر اشتباهات</h2>
      <div class="glass-card">
        <textarea id="mistakeText" rows="3" placeholder="نکته یا اشتباه مهم را بنویسید..."></textarea>
        <button class="btn-glow" onclick="addMistake()">افزودن به دفتر</button>
      </div>
      <ul id="mistakeList" class="mistake-list"></ul>
    </section>
  </main>

  <!-- بارگذاری اسکریپت‌ها به ترتیب صحیح -->
  <script src="js/storage.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
